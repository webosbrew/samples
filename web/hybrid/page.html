<!doctype html>
<meta charset="utf-8">
<title>hybrid web view</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1b2a; color: #e8eef5;
               font: 32px/1.5 system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 32px; }
  h1 { font-size: 64px; margin: 0; font-weight: 600; }
  p { margin: 0; opacity: .75; }
  button { font: inherit; font-size: 36px; padding: 20px 56px; border: 0;
           border-radius: 12px; background: #4285f4; color: #fff; cursor: pointer; }
  button:focus { outline: 6px solid #ffffff88; }
  #warn { color: #ffb4a2; }
</style>
<main>
  <h1>web view</h1>
  <p>Chromium, in the same process as the SDL view.</p>
  <button id="exit" autofocus>Back to native</button>
  <p id="hint">or press Back on the remote</p>
</main>
<script>
  // PalmSystem is libcbe's injected bridge - the app loads it with
  // LoadExtension("palmsystem"). close() arrives in native code as
  // WebViewDelegate::Close(), which is a callback meant for exactly this and
  // costs the page nothing else.
  function exitToNative() {
    if (typeof PalmSystem === 'undefined') {
      document.getElementById('hint').id = 'warn';
      document.getElementById('warn').textContent =
          'PalmSystem missing - the app did not load the injection';
      return;
    }
    PalmSystem.close();
  }

  document.getElementById('exit').addEventListener('click', exitToNative);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') exitToNative();
    if (e.key === 'Backspace' || e.key === 'Escape') exitToNative();
  });

  console.log('hybrid page ready');
</script>
